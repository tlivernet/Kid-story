<style>
  * { box-sizing: border-box; }
  .vl {

    --texte: #f7f0e2; --texte-doux: #bcb0dc;
    --or: #ffcf6b; --rose: #ff8fa9; --vert: #6fd39a; --bleu: #79b4ff;
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--nuit); color: var(--texte);
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .vl-barre { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .vl-icone {
    width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--nuit-clair);
    border: 2px solid var(--bord); display: grid; place-items: center;
  }
  .vl-jauges {
    flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--nuit-clair); border: 2px solid var(--bord); border-radius: 999px;
  }
  .vl-coeurs { display: flex; gap: 4px; }
  .vl-sep { width: 2px; height: 20px; background: var(--bord); border-radius: 1px; }
  .vl-etoiles { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 1.05rem; color: var(--or); }

  .vl-planche {
    flex: none; margin: 4px 16px 0; height: 150px; border-radius: 26px; overflow: hidden;
    border: 2px solid var(--bord); box-shadow: 0 0 40px rgba(255, 207, 107, 0.16);
  }
  .vl-planche svg { display: block; width: 100%; height: 100%; }

  .vl-chapitre {
    flex: none; margin: 14px 0 2px; text-align: center; color: var(--or);
    font-size: 0.85rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .vl-texte {
    flex: 1; min-height: 0; overflow: hidden; padding: 6px 22px 0; max-width: 30ch; margin: 0 auto;
    font-size: 1.4rem; line-height: 1.9; letter-spacing: 0.015em;
  }
  .vl-phrase { display: block; padding: 2px 8px; margin-bottom: 6px; border-radius: 10px; border-left: 4px solid transparent; }
  .vl-phrase.dite { background: rgba(255, 207, 107, 0.12); border-left-color: var(--or); }
  .vl-mot { background: var(--or); color: #241a45; border-radius: 8px; padding: 0 4px; font-weight: 700; }

  .vl-choix { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 10px; }
  .vl-carte {
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px;
    background: var(--carte); border: 2px solid var(--bord); border-left: 8px solid var(--c);
    border-radius: 20px; padding: 11px 14px 13px;
  }
  .vl-carte .num {
    width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--c); color: #1a1338;
    display: grid; place-items: center; font-weight: 900; font-size: 1rem;
  }
  .vl-carte .plaque { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 1.7rem; background: rgba(255,255,255,.07); }
  .vl-carte .lib { flex: 1; font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
  .vl-carte.active { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset, 0 0 26px rgba(121, 180, 255, 0.22); }
  .vl-jauge { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--c); border-radius: 0 6px 6px 0; }

  .vl-lecture { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px 16px; background: var(--nuit-clair); }
  .vl-petit { width: 48px; height: 48px; flex: none; border-radius: 50%; background: transparent; border: 2px solid var(--bord); display: grid; place-items: center; }
  .vl-gros {
    width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--or); border: none;
    display: grid; place-items: center; box-shadow: 0 0 30px rgba(255, 207, 107, 0.45);
  }
  .vl-astuce { font-size: 0.82rem; font-weight: 700; color: var(--texte-doux); line-height: 1.35; }
</style>
