<script src="./support.js"></script>
<!-- Direction A « Grand livre » — épreuve de lecture (CP). Le mot à lire est
     toujours de l'encre #2f2545 sur un fond clair : c'est le correctif du
     problème de contraste signalé en usage réel. -->
<style>
  * { box-sizing: border-box; }
  .ep {
    --papier: #fdf6e8; --papier-fonce: #f4e6cd; --carte: #ffffff;
    --encre: #2f2545; --encre-doux: #5c5175;
    --violet: #5b3fa8; --violet-clair: #7b5ed6; --vert: #3fae6a; --or: #ffc94d;
    --rayon: 22px; --ombre: 0 10px 24px rgba(47, 37, 69, 0.16);
    position: relative; width: 390px; height: 844px; overflow: hidden;
    background: var(--papier); color: var(--encre);
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .ep-arriere { position: absolute; inset: 0; filter: blur(2px); opacity: .9; }
  .ep-arriere .ciel { height: 300px; background: linear-gradient(#bfe4ff, #e8f4ff); }
  .ep-arriere .sol { height: 544px; background: var(--papier); }
  .ep-scrim { position: absolute; inset: 0; background: rgba(47, 37, 69, 0.55); }

  .ep-centre { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
  .ep-boite {
    width: 100%; background: var(--papier); border-radius: 28px; padding: 22px 20px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.34);
  }
  .ep-chapeau { display: flex; align-items: center; gap: 8px; }
  .ep-chapeau .puce { width: 30px; height: 30px; border-radius: 10px; background: #efe9ff; display: grid; place-items: center; font-size: 1rem; }
  .ep-chapeau b { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.02em; }

  .ep-consigne { margin: 0; text-align: center; font-size: 1.32rem; font-weight: 900; color: var(--violet); line-height: 1.3; }
  .ep-objectif {
    display: flex; align-items: center; gap: 8px; font-size: 0.92rem; font-weight: 800; color: #6b5f3f;
    background: #fff6e0; border: 2px solid #f0dcae; border-radius: 999px; padding: 7px 14px;
  }

  .ep-hp { display: flex; gap: 6px; }

  .ep-mots { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .ep-mot {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--carte); color: var(--encre);
    border: 3px solid var(--papier-fonce); border-radius: 18px;
    padding: 15px 14px; box-shadow: var(--ombre);
    font-size: 1.72rem; font-weight: 800; letter-spacing: 0.02em;
  }
  .ep-mot.choisi { background: #efe9ff; border-color: var(--violet); color: var(--encre); box-shadow: 0 0 0 3px var(--violet) inset, var(--ombre); }
  .ep-mot.juste { background: #e3f4ea; border-color: var(--vert); color: #1e5c36; }
  .ep-mot small { font-size: 0.78rem; font-weight: 800; color: var(--encre-doux); letter-spacing: 0.06em; text-transform: uppercase; }

  .ep-ecoute {
    display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 800; color: var(--encre-doux);
  }
  .ep-ecoute .bouton {
    width: 54px; height: 54px; border-radius: 50%; background: var(--violet); border: 3px solid var(--violet-clair);
    display: grid; place-items: center; box-shadow: 0 8px 18px rgba(91, 63, 168, 0.36);
  }
  .ep-pied { font-size: 0.86rem; font-weight: 700; color: var(--encre-doux); text-align: center; margin: 2px 0 0; }
</style>

<div class="ep">
  <div class="ep-arriere"><div class="ciel"></div><div class="sol"></div></div>
  <div class="ep-scrim"></div>

  <div class="ep-centre">
    <div class="ep-boite">
      <div class="ep-chapeau">
        <span class="puce">📖</span><b>Épreuve de lecture</b>
      </div>

      <p class="ep-consigne">Touche le mot que tu entends.</p>

      <span class="ep-objectif">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#c99400" stroke="#8a6100" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l2.7 5.7 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3 1.2-6.2L3 9.5l6.3-.8z"/></svg>
        Trouve le bon mot pour gagner une étoile
      </span>

      <div class="ep-ecoute">
        <span class="bouton">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M4 9.5h3.6L12 5.4v13.2L7.6 14.5H4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M17.9 6a8.2 8.2 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        Réécouter le mot
      </div>

      <div class="ep-mots">
        <div class="ep-mot">rivière</div>
        <div class="ep-mot choisi">héron</div>
        <div class="ep-mot">bateau</div>
      </div>

      <span class="ep-hp">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="#e0574f"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="#e0574f"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="none" stroke="#c9b9a2" stroke-width="2"/></svg>
      </span>
      <p class="ep-pied">Si tu te trompes, tu perds un cœur — mais l’histoire continue toujours.</p>
    </div>
  </div>
</div>
