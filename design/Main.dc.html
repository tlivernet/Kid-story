<script src="./support.js"></script>
<!-- Direction A « Grand livre » — écran de lecture. Tokens repris de css/app.css :
     crème #fdf6e8, encre #2f2545, violet #5b3fa8, or #ffc94d, rayon 22px. -->
<style>
  * { box-sizing: border-box; }
  .gl {
    --papier: #fdf6e8; --papier-fonce: #f4e6cd; --carte: #ffffff;
    --encre: #2f2545; --encre-doux: #5c5175;
    --violet: #5b3fa8; --violet-clair: #7b5ed6; --or: #ffc94d; --or-voile: #fff6e0;
    --rayon: 22px; --ombre: 0 10px 24px rgba(47, 37, 69, 0.16);
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--papier); color: var(--encre);
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  /* --- Bandeau : trois éléments au lieu de six ------------------------------ */
  .gl-barre { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .gl-icone {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    background: var(--carte); border: 2px solid var(--papier-fonce);
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(47, 37, 69, 0.10);
  }
  .gl-jauges {
    flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--carte); border: 2px solid var(--papier-fonce);
    border-radius: 999px; box-shadow: 0 4px 12px rgba(47, 37, 69, 0.10);
  }
  .gl-coeurs { display: flex; gap: 4px; }
  .gl-sep { width: 2px; height: 20px; background: var(--papier-fonce); border-radius: 1px; }
  .gl-etoiles { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 1.05rem; color: #8a6100; }

  /* --- La planche illustrée, encadrée comme dans un album ------------------- */
  .gl-planche {
    flex: none; margin: 4px 16px 0; height: 152px; border-radius: 26px;
    border: 4px solid var(--carte); overflow: hidden;
    box-shadow: 0 14px 30px rgba(47, 37, 69, 0.20);
  }
  .gl-planche svg { display: block; width: 100%; height: 100%; }

  .gl-chapitre {
    flex: none; margin: 14px 0 2px; text-align: center;
    font-size: 0.86rem; font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--violet);
  }

  /* --- Le texte : lignes courtes, phrase en cours signalée par un filet ----- */
  .gl-texte {
    flex: 1; min-height: 0; overflow: hidden; padding: 6px 20px 0;
    font-size: 1.4rem; line-height: 1.85; letter-spacing: 0.01em;
    max-width: 30ch; margin: 0 auto;
  }
  .gl-phrase { display: block; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; border-left: 4px solid transparent; }
  .gl-phrase.dite { background: var(--or-voile); border-left-color: var(--or); }
  .gl-mot {
    background: var(--or); color: var(--encre); border-radius: 8px;
    padding: 0 3px; box-shadow: 0 2px 0 #e0a92a;
  }

  /* --- Les choix ------------------------------------------------------------ */
  .gl-choix { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 10px; }
  .gl-carte {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 12px;
    background: var(--carte); border: 3px solid var(--papier-fonce); border-left: 10px solid var(--c);
    border-radius: var(--rayon); padding: 11px 14px 13px;
    box-shadow: var(--ombre);
  }
  .gl-carte .num {
    width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: 1rem;
  }
  .gl-carte .plaque {
    width: 46px; height: 46px; flex: none; border-radius: 15px; display: grid; place-items: center;
    font-size: 1.75rem; background: var(--voile); 
  }
  .gl-carte .lib { flex: 1; font-size: 1.12rem; font-weight: 700; line-height: 1.25; }
  .gl-carte.active {
    border-color: var(--c); background: #fffdf6;
    box-shadow: 0 0 0 3px var(--c) inset, var(--ombre);
  }
  .gl-jauge { position: absolute; left: 0; bottom: 0; height: 10px; background: var(--c); border-radius: 0 6px 6px 0; }

  /* --- La barre de lecture : un bouton principal, deux secondaires ---------- */
  .gl-lecture {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px 14px; background: var(--papier-fonce);
  }
  .gl-petit {
    width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--carte);
    border: 2px solid #e6d3b3; display: grid; place-items: center;
  }
  .gl-gros {
    width: 64px; height: 64px; flex: none; border-radius: 50%;
    background: var(--violet); border: 3px solid var(--violet-clair);
    display: grid; place-items: center; box-shadow: 0 8px 18px rgba(91, 63, 168, 0.38);
  }
  .gl-astuce { font-size: 0.82rem; font-weight: 700; color: #6b5f3f; line-height: 1.35; }
</style>

<div class="gl">
  <header class="gl-barre">
    <div class="gl-icone" aria-label="Accueil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b3fa8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11 12 3l9 8"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/>
      </svg>
    </div>

    <div class="gl-jauges">
      <span class="gl-coeurs">
        <svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="#e0574f"/></svg>
        <svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="#e0574f"/></svg>
        <svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 21S3.5 15.3 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6C20.5 15.3 12 21 12 21z" fill="none" stroke="#c9b9a2" stroke-width="2"/></svg>
      </span>
      <span class="gl-sep"></span>
      <span class="gl-etoiles">
        <svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 3l2.7 5.7 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3 1.2-6.2L3 9.5l6.3-.8z" fill="#ffc94d" stroke="#c99400" stroke-width="1.2" stroke-linejoin="round"/></svg>
        3
      </span>
    </div>

    <div class="gl-icone" aria-label="Sac, résumé et voix">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#5b3fa8"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg>
    </div>
  </header>

  <div class="gl-planche">
    <svg viewBox="0 0 350 188" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="ciel-a" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe4ff"/><stop offset="1" stop-color="#e8f4ff"/>
        </linearGradient>
      </defs>
      <rect width="350" height="188" fill="url(#ciel-a)"/>
      <circle cx="292" cy="38" r="24" fill="#ffe9a8"/>
      <path d="M40 44q14-12 28 0 12-8 20 4H32q0-6 8-4z" fill="#fff" opacity=".85"/>
      <path d="M0 120q60-30 120-6t110-4 120 12v66H0z" fill="#8fd0a0"/>
      <path d="M0 148q80-18 160 6t190-8v42H0z" fill="#63b581"/>
      <path d="M0 132q70 14 140 2t210 6v14q-120-16-210-2T0 146z" fill="#7ec9e8" opacity=".9"/>
      <rect x="96" y="112" width="164" height="11" rx="4" fill="#c08d54"/>
      <rect x="96" y="112" width="164" height="4" rx="2" fill="#dcae76"/>
      <rect x="110" y="123" width="8" height="30" fill="#a97a45"/>
      <rect x="238" y="123" width="8" height="30" fill="#a97a45"/>
      <text x="126" y="108" font-size="40">🧒</text>
      <text x="212" y="106" font-size="34">🦩</text>
      <ellipse cx="146" cy="118" rx="20" ry="4" fill="#2f2545" opacity=".12"/>
    </svg>
  </div>

  <p class="gl-chapitre">Chapitre 4 · Le vieux pont</p>

  <div class="gl-texte">
    <span class="gl-phrase">Le vieux pont grince sous tes pieds.</span>
    <span class="gl-phrase dite">En dessous, la <span class="gl-mot">rivière</span> chante.</span>
    <span class="gl-phrase">Un héron te regarde.</span>
  </div>

  <div class="gl-choix">
    <div class="gl-carte active" style="--c:#3f7fd6; --voile:#e4eefb">
      <span class="num">1</span><span class="plaque">🐦</span>
      <span class="lib">Parler doucement au héron.</span>
      <span class="gl-jauge" style="width: 58%"></span>
    </div>
    <div class="gl-carte" style="--c:#e8862f; --voile:#fceee0">
      <span class="num">2</span><span class="plaque">🏃</span>
      <span class="lib">Traverser le pont en courant.</span>
    </div>
    <div class="gl-carte" style="--c:#3fae6a; --voile:#e3f4ea">
      <span class="num">3</span><span class="plaque">🐟</span>
      <span class="lib">Chercher un poisson pour lui.</span>
    </div>
  </div>

  <footer class="gl-lecture">
    <div class="gl-petit" aria-label="Relire">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b3fa8" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 6.5V12h5.5"/>
      </svg>
    </div>
    <div class="gl-gros" aria-label="Pause">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="4" width="4.4" height="16" rx="2"/><rect x="13.6" y="4" width="4.4" height="16" rx="2"/></svg>
    </div>
    <div class="gl-petit" aria-label="Voir les choix">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#5b3fa8"><path d="M5 5l9 7-9 7z"/><rect x="16.5" y="5" width="3" height="14" rx="1.5"/></svg>
    </div>
    <span class="gl-astuce">Touche un mot<br>pour l’entendre 👆</span>
  </footer>
</div>
